<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2E1F17">
<title>Пещерный магнат</title>
<script>/tgWebAppData=/.test(location.hash) && document.write('<script src="https://telegram.org/js/telegram-web-app.js"><\/script>');</script>
<link rel="stylesheet" href="styles/base.css?v=1.3.1">
<link rel="stylesheet" href="styles/hud.css?v=1.3.1">
<link rel="stylesheet" href="styles/sheet.css?v=1.3.1">
<link rel="stylesheet" href="styles/items.css?v=1.3.1">
<link rel="stylesheet" href="styles/overlays.css?v=1.3.1">
<script type="importmap">
{"imports": {
  "./src/config.js": "./src/config.js?v=1.3.1",
  "./src/format.js": "./src/format.js?v=1.3.1",
  "./src/core/economy.js": "./src/core/economy.js?v=1.3.1",
  "./src/core/formulas.js": "./src/core/formulas.js?v=1.3.1",
  "./src/core/quests.js": "./src/core/quests.js?v=1.3.1",
  "./src/core/state.js": "./src/core/state.js?v=1.3.1",
  "./src/platform/saves.js": "./src/platform/saves.js?v=1.3.1",
  "./src/platform/sound.js": "./src/platform/sound.js?v=1.3.1",
  "./src/platform/stars.js": "./src/platform/stars.js?v=1.3.1",
  "./src/platform/telegram.js": "./src/platform/telegram.js?v=1.3.1",
  "./src/data/achs.js": "./src/data/achs.js?v=1.3.1",
  "./src/data/chapters.js": "./src/data/chapters.js?v=1.3.1",
  "./src/data/shop.js": "./src/data/shop.js?v=1.3.1",
  "./src/data/techs.js": "./src/data/techs.js?v=1.3.1",
  "./src/data/units.js": "./src/data/units.js?v=1.3.1",
  "./src/data/valleys.js": "./src/data/valleys.js?v=1.3.1",
  "./src/game.js": "./src/game.js?v=1.3.1",
  "./src/scene/beasts.js": "./src/scene/beasts.js?v=1.3.1",
  "./src/scene/farm.js": "./src/scene/farm.js?v=1.3.1",
  "./src/scene/fx.js": "./src/scene/fx.js?v=1.3.1",
  "./src/scene/people.js": "./src/scene/people.js?v=1.3.1",
  "./src/scene/scene.js": "./src/scene/scene.js?v=1.3.1",
  "./src/scene/view.js": "./src/scene/view.js?v=1.3.1",
  "./src/ui/dom.js": "./src/ui/dom.js?v=1.3.1",
  "./src/ui/lists.js": "./src/ui/lists.js?v=1.3.1",
  "./src/ui/progress.js": "./src/ui/progress.js?v=1.3.1",
  "./src/ui/rating.js": "./src/ui/rating.js?v=1.3.1",
  "./src/ui/session.js": "./src/ui/session.js?v=1.3.1",
  "./src/ui/settings.js": "./src/ui/settings.js?v=1.3.1",
  "./src/ui/shop.js": "./src/ui/shop.js?v=1.3.1",
  "./src/ui/tutorial.js": "./src/ui/tutorial.js?v=1.3.1"
}}
</script>
</head>
<body>
<div id="app">
  <canvas id="canvas"></canvas>
  <div id="hud">
    <div id="counter">
      <img src="assets/twemoji/1f356.svg" alt="">
      <div class="hudtext"><b id="meat">0</b><div class="sub"><span id="cap"></span></div><div class="heat"><i id="heatBar"></i></div><div id="rate" class="rate"></div></div>
    </div>
    <div class="tools">
      <button id="shells" class="round shells" aria-label="Лавка шамана"><img src="assets/twemoji/1f41a.svg" alt=""><span id="shellCount">0</span></button>
      <button id="gear" class="round" aria-label="Настройки"><img src="assets/twemoji/2699.svg" alt=""></button>
      <button id="rank" class="round" aria-label="Рейтинг вождей" hidden><img src="assets/twemoji/1f451.svg" alt=""></button>
    </div>
    <div id="active" class="active"></div>
  </div>
  <button id="hunt"><img src="assets/twemoji/1f446.svg" alt=""><span id="huntText">Охотиться</span></button>
  <div id="coach" hidden><img src="assets/twemoji/1f5ff.svg" alt=""><div><p id="coachText"></p><div class="coach-btns"><button id="coachOk" hidden></button><button id="coachSkip">Пропустить обучение</button></div></div></div>
  <img id="finger" src="assets/twemoji/1f446.svg" alt="" hidden>
  <div id="ring" hidden></div>
  <div id="sheet">
    <div class="sheet-head"><b id="sheetTitle"></b><button id="close" aria-label="Закрыть"><img src="assets/twemoji/2716.svg" alt=""></button></div>
    <div id="sheetBody">
      <div class="sec" data-sec="quests">
        <h2><span id="valley"></span><span id="stageNo"></span></h2>
        <section id="quests" class="item quests"><div class="qhead"><img src="assets/twemoji/1f3c6.svg" alt="">Задания</div></section>
        <h2>Достижения <span id="achCount"></span></h2>
        <section id="achs"></section>
        <button id="tutAgain">Пройти обучение заново</button>
        <button id="reset">Начать заново</button>
        <div id="credit">Графика: Twemoji, CC-BY 4.0</div>
      </div>
      <div class="sec" data-sec="yard"><section id="stations"></section></div>
      <div class="sec" data-sec="tribe"><h2>Места в пещере <span id="staff"></span></h2><section id="workers"></section></div>
      <div class="sec" data-sec="farm"><div id="farmNote" class="note"><img src="assets/twemoji/1f33e.svg" alt=""><span id="farmText"></span></div><h2>Хлев <span id="herd"></span></h2><section id="farm"></section></div>
      <div class="sec" data-sec="shop"><div class="note"><img src="assets/twemoji/1f41a.svg" alt=""><span id="shopText"></span></div><section id="boosts"></section><div id="starShop" hidden><h2>За звёзды</h2><section id="stars"></section></div></div>
      <div class="sec" data-sec="settings"><div class="note"><img src="assets/twemoji/1f4a7.svg" alt=""><span>Чтобы потушить костёр, подержи на нём палец.</span></div><section id="settings"></section></div>
      <div class="sec" data-sec="rank"><div class="note"><img src="assets/twemoji/1f451.svg" alt=""><span id="rankText"></span></div><section id="ranks"></section><button id="hideRank"></button></div>
      <div class="sec" data-sec="techs"><h2>Сделано <span id="techCount"></span></h2><div id="allTechs" class="note"><img src="assets/twemoji/1f3a8.svg" alt=""><span>Все открытия изучены! Ниже то, что уже работает на племя.</span></div><section id="techs"></section><h2 id="doneHead">Изучено</h2><section id="techsDone"></section></div>
    </div>
  </div>
  <nav id="nav">
    <button data-sec="quests"><img src="assets/twemoji/1f3c6.svg" alt="">Задания<i></i></button>
    <button data-sec="yard"><img src="assets/twemoji/1f525.svg" alt="">Двор<i></i></button>
    <button data-sec="tribe"><img src="assets/twemoji/1f3f9.svg" alt="">Племя<i></i></button>
    <button data-sec="farm"><img src="assets/twemoji/1f33e.svg" alt="">Ферма<i></i></button>
    <button data-sec="techs"><img src="assets/twemoji/1f3a8.svg" alt="">Открытия<i></i></button>
  </nav>
  <div id="banner"><img id="bannerIcon" src="assets/twemoji/1f389.svg" alt=""><span id="bannerText"></span></div>
  <div id="modal"><div><img id="mIcon" alt=""><span id="mText"></span><b id="mBig"></b><button id="mOk"></button><button id="mNo">Позже</button></div></div>
  <div id="story" hidden><div class="story-card"><img id="storyIcon" alt=""><b id="storyTitle"></b><p id="storyText"></p><button id="storyNext"></button></div></div>
  <div id="fade"></div>
</div>
<script type="module" src="src/main.js?v=1.3.1"></script>
</body>
</html>
